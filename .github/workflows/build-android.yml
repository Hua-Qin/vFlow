name: Android CI

# Auto-adapted for Android (Kotlin + Gradle Kotlin DSL, multi-module :app/:core, native CMake).
# High-performance CI: only builds the arm64-v8a debug APK with maximal caching & parallelism.
#
# Caching strategy (6 layers, keys derived from immutable lockfiles):
#   1. JDK tarball                 : setup-java cache=gradle        (~100MB)
#   2. Gradle wrapper dist         : actions/cache on wrapper/dists (~150MB gradle-X-bin.zip)
#   3. Konan / Kotlin Native       : actions/cache on ~/.konan      (~300MB LLVM toolchains)
#   4. Android SDK components      : actions/cache on ANDROID_HOME
#        platforms / build-tools / ndk / cmake                     (hundreds of MB)
#   5. Gradle build cache + deps   : gradle/actions/setup-gradle@v4 (always; handles deps+gc)
#   6. CMake / .cxx per-module     : actions/cache per C++ source hash
#                                   (avoids re-linking vflow_shell_exec when C++ untouched)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Windows runner uses this default path; pin for cache consistency.
      ANDROID_SDK_ROOT: 'C:\Users\runneradmin\AppData\Local\Android\Sdk'
      ANDROID_HOME: 'C:\Users\runneradmin\AppData\Local\Android\Sdk'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # NOTE: intentionally do NOT set `cache: gradle` here.
          # gradle/actions/setup-gradle@v4 (below) owns the Gradle home cache.

      # ---------------------------------------------------------------------
      # Cache key hashes. Separate step so we can dump them in the log
      # and debug miss reasons without scrolling through Post Cache steps.
      # ---------------------------------------------------------------------
      - name: Compute cache keys (diagnostic)
        id: cache-keys
        shell: bash
        run: |
          set -e
          WRAPPER_PROPS_HASH=$(sha256sum gradle/wrapper/gradle-wrapper.properties | awk '{print $1}')
          echo "wrapper_props=$WRAPPER_PROPS_HASH" >> "$GITHUB_OUTPUT"
          BUILD_FILES_HASH=$( (
              cat build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null
              find app core -maxdepth 2 -name 'build.gradle.kts' -print -exec cat {} \;
          ) | sha256sum | awk '{print $1}')
          echo "build_files=$BUILD_FILES_HASH" >> "$GITHUB_OUTPUT"
          NATIVE_HASH=$( (
              find core/src/cpp -type f \( -name '*.cpp' -o -name '*.h' -o -name 'CMakeLists.txt' \) -print -exec cat {} \;
              find app -maxdepth 3 -name 'CMakeLists.txt' -print -exec cat {} \;
          ) 2>/dev/null | sha256sum | awk '{print $1}')
          echo "native=$NATIVE_HASH" >> "$GITHUB_OUTPUT"
          SDK_BOOTSTRAP_HASH=$( (
              echo "AGP from root build.gradle.kts:"
              grep -E 'com\.android\.tools\.build:gradle|agp' build.gradle.kts buildSrc/**/*.kt* 2>/dev/null || true
              echo "SDK versions:"
              grep -E 'compileSdk|targetSdk|minSdk|ndkVersion' \
                app/build.gradle.kts core/build.gradle.kts 2>/dev/null || true
          ) | sha256sum | awk '{print $1}')
          echo "sdk_bootstrap=$SDK_BOOTSTRAP_HASH" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # (2) Gradle wrapper dist (~150MB gradle-X-bin.zip).
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: >-
            ${{ runner.os }}-gradle-wrapper-${{
              steps.cache-keys.outputs.wrapper_props }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      # (3) Konan / Kotlin Native toolchain (~300MB).
      - name: Cache Kotlin/Native (Konan) toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: >-
            ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # (4) Android SDK components (platforms / build-tools / ndk / cmake).
      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\Android\Sdk\platforms
            C:\Users\runneradmin\AppData\Local\Android\Sdk\build-tools
            C:\Users\runneradmin\AppData\Local\Android\Sdk\ndk
            C:\Users\runneradmin\AppData\Local\Android\Sdk\cmake
            C:\Users\runneradmin\AppData\Local\Android\Sdk\licenses
          key: >-
            ${{ runner.os }}-android-sdk-${{
              steps.cache-keys.outputs.sdk_bootstrap }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # (5) Gradle build cache + Gradle dependency cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY || '' }}
          gradle-home-cache-cleanup: true

      # (6) CMake / Ninja outputs per module (~vflow_shell_exec native .so).
      - name: Cache C++ native build outputs (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            app/build/.cxx
            core/build/.cxx
          key: >-
            ${{ runner.os }}-cxx-arm64-v8a-${{
              steps.cache-keys.outputs.native }}-${{
              steps.cache-keys.outputs.build_files }}
          restore-keys: |
            ${{ runner.os }}-cxx-arm64-v8a-${{ steps.cache-keys.outputs.native }}-
            ${{ runner.os }}-cxx-arm64-v8a-

      - name: Install dependencies & build arm64-v8a debug APK
        shell: bash
        run: ./gradlew --stacktrace :app:assembleDebug -Pvflow.abi=arm64-v8a --build-cache --parallel --no-daemon

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
