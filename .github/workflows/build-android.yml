name: Android CI

# Auto-adapted for Android (Kotlin + Gradle Kotlin DSL, multi-module :app/:core, native CMake).
# Produces a downloadable Android APK artifact on the Actions run page.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Install dependencies & build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-CI
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/mapping/debug/mapping.txt
          if-no-files-found: error
          retention-days: 14
