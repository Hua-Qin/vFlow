name: Android CI

# Auto-adapted for Android (Kotlin + Gradle Kotlin DSL, multi-module :app/:core, native CMake).
# High-performance CI: only builds the arm64-v8a debug APK with maximal caching & parallelism.
#
# Caching strategy (5 layers, keys derived from immutable lockfiles):
#   1. JDK tarball                 : setup-java cache=gradle        (~100MB)
#   2. Gradle wrapper dist         : actions/cache on wrapper/dists (~150MB gradle-X-bin.zip)
#   3. Konan / Kotlin Native       : actions/cache on ~/.konan      (~300MB LLVM toolchains)
#   4. Gradle build cache + deps   : gradle/actions/setup-gradle@v4 (always; handles deps+gc)
#   5. CMake / .cxx per-module     : actions/cache per C++ source hash
#                                   (avoids re-linking vflow_shell_exec when C++ untouched)
# NOTE: Android SDK components are NOT cached because windows-latest image pre-installs them.
#   Caching SDK paths that differ between image versions causes "SDK location not found" errors.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Detect the actual Android SDK path on the runner image and write local.properties.
      # This is critical on Windows where the path can change between image versions.
      - name: Configure Android SDK path
        shell: powershell
        run: |
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"

          $sdkPath = $env:ANDROID_HOME
          if (-not $sdkPath) { $sdkPath = $env:ANDROID_SDK_ROOT }
          if (-not $sdkPath) { $sdkPath = "$env:LOCALAPPDATA\Android\Sdk" }

          if (-not (Test-Path $sdkPath)) {
            Write-Host "SDK not found at $sdkPath, searching..."
            $candidates = @(
              "$env:LOCALAPPDATA\Android\Sdk",
              "C:\Users\runneradmin\AppData\Local\Android\Sdk",
              "C:\Android\Sdk"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $sdkPath = $c; break }
            }
          }

          Write-Host "Using SDK path: $sdkPath"
          if (-not (Test-Path $sdkPath)) {
            throw "Android SDK not found anywhere!"
          }

          # Write local.properties with Java-style escaped backslashes
          $escaped = $sdkPath -replace '\\', '\\'
          "sdk.dir=$escaped" | Set-Content -Path local.properties -Encoding ascii
          Write-Host "local.properties content:"
          Get-Content local.properties

      # ---------------------------------------------------------------------
      # Cache key hashes. Separate step so we can dump them in the log
      # and debug miss reasons without scrolling through Post Cache steps.
      # ---------------------------------------------------------------------
      - name: Compute cache keys (diagnostic)
        id: cache-keys
        shell: bash
        run: |
          set -e
          WRAPPER_PROPS_HASH=$(sha256sum gradle/wrapper/gradle-wrapper.properties | awk '{print $1}')
          echo "wrapper_props=$WRAPPER_PROPS_HASH" >> "$GITHUB_OUTPUT"
          BUILD_FILES_HASH=$( (
              cat build.gradle.kts settings.gradle.kts gradle/libs.versions.toml gradle.properties 2>/dev/null
              find app core -maxdepth 2 -name 'build.gradle.kts' -print -exec cat {} \;
          ) | sha256sum | awk '{print $1}')
          echo "build_files=$BUILD_FILES_HASH" >> "$GITHUB_OUTPUT"
          NATIVE_HASH=$( (
              find app/src/main/cpp -type f \( -name '*.cpp' -o -name '*.h' -o -name 'CMakeLists.txt' \) -print -exec cat {} \;
          ) 2>/dev/null | sha256sum | awk '{print $1}')
          echo "native=$NATIVE_HASH" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # (2) Gradle wrapper dist (~150MB gradle-X-bin.zip).
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: >-
            ${{ runner.os }}-gradle-wrapper-${{
              steps.cache-keys.outputs.wrapper_props }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      # (3) Konan / Kotlin Native toolchain (~300MB).
      - name: Cache Kotlin/Native (Konan) toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: >-
            ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # (4) Gradle build cache + Gradle dependency cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          gradle-home-cache-cleanup: true

      # (5) CMake / Ninja outputs for native code (vflow_shell_exec, ncnn, sherpa-ncnn .so).
      - name: Cache C++ native build outputs (.cxx)
        uses: actions/cache@v4
        with:
          path: app/build/.cxx
          key: >-
            ${{ runner.os }}-cxx-arm64-v8a-${{
              steps.cache-keys.outputs.native }}-${{
              steps.cache-keys.outputs.build_files }}
          restore-keys: |
            ${{ runner.os }}-cxx-arm64-v8a-${{ steps.cache-keys.outputs.native }}-
            ${{ runner.os }}-cxx-arm64-v8a-

      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Pre-resolve Gradle dependencies (offline-aware)
        shell: bash
        run: >
          ./gradlew --no-daemon --build-cache --parallel
          :app:dependencies --configuration debugCompileClasspath
          2>&1 | tail -5 || true

      - name: Build arm64-v8a debug APK
        shell: bash
        run: >
          ./gradlew --stacktrace
          :app:assembleDebug
          -Pvflow.abi=arm64-v8a
          --build-cache --parallel --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -e
          echo "=== APK build outputs ==="
          find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
          echo "=== APK count ==="
          find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | wc -l
          echo "=== APK sizes ==="
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
